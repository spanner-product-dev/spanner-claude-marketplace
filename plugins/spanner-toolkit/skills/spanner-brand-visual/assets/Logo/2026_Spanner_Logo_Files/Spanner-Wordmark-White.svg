<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813.16 170.95" role="img" aria-label="Spanner">
<title>Spanner</title>
<style>svg:root{color:#FFFFFF}</style>
<!--
  Spanner wordmark - White - 2026 file set.
  Geometry is the 2024 Azure artwork, unmodified: the same seven curves, translated into a
  viewBox cropped to the ink. Nothing was redrawn and no colour was re-sampled.

  viewBox 0 0 813.16 170.95 - the artwork exactly, no padding.
    The 2024 re-export inherited a padded artboard from the 2015 Blue export it was
    recoloured from (viewBox 0 0 965.951 275.986 around this same 813.16 x 170.95 artwork),
    so ink filled only 61.9% of the declared height and height:45px rendered a 27.9px
    wordmark. The 2015 EPS and PNG files never had this problem; the 2024 SVG and its PNG
    renders did. This set has it in no file.

  No width/height attributes - CSS, or the placing application, always decides the size.
    The 2024 SVG carried width="965.951px" height="275.986px", which becomes an intrinsic
    size that wins in <img>, in Slides/PowerPoint import, and on paste into Office.

  Colour via fill="currentColor", default set in svg:root above.
    :root matches this <svg> only when the file IS the document - opened alone, or loaded
    through <img> - so standalone it renders White #FFFFFF. Inlined into HTML the root is
    <html>, the rule matches nothing, and `color` inherits normally, from the <svg> itself
    or any ancestor:
        <svg ... style="height:30px;width:auto;color:#fff">    white on navy
        <div style="color:#293A49"> <svg .../> </div>          navy on light
    One consequence: inlined on a page that sets no colour at all, this inherits the page
    text colour and renders black. Set `color` wherever you place it.

  SIZING - the one constant worth knowing:
    `height` is the FULL ink, which includes the descender of the p.
    The letter body - what reads as the size of the logo - is 0.740 x height,
    and the baseline sits 0.260 x height above the bottom edge.
    The s07 header lockup's 30px box therefore gives 22.2px letters.

  If this is ever re-exported from Illustrator: crop the artboard to the artwork before
  saving, then delete the width and height attributes. Do not re-pad it.
-->
